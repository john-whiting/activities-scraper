name: Integration tests

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run integration tests
        id: tests
        run: pnpm test:integration

      - name: Open issue on failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Integration test failure: ${new Date().toISOString().slice(0, 10)}`;
            const body = `The daily integration tests failed on ${new Date().toISOString()}.\n\nCheck the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['scraper-failure'],
            });
